apiVersion: v1
kind: Namespace
metadata:
  name: ot-microservices
---
# --- WAVE 1: DATABASES ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ot-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "supersecretpassword"
        - name: MYSQL_DATABASE
          value: "employee_db"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ot-microservices
spec:
  ports:
  - port: 3306
  selector:
    app: mysql
---
# --- WAVE 2: CORE BACKEND APIS ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: ot-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      containers:
      - name: employee-api
        image: opstree/ot-employee:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: employee-api
  namespace: ot-microservices
spec:
  ports:
  - port: 8080
  selector:
    app: employee-api
